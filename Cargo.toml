[package]
name = "project_overlay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
