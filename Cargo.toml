[package]
name = "project_overlay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition"] }
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
wgpu = "30.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
